name: Publish one minute test snapshot
description: Fetch, validate, prepublish, and deploy one real ranking snapshot.
inputs:
  cycle:
    description: Unique artifact suffix
    required: true
runs:
  using: composite
  steps:
    - name: Wait for next test cycle
      id: pace
      shell: bash
      run: python test_cycle.py
    - name: Fetch fresh data
      if: steps.pace.outputs.needed == 'true'
      shell: bash
      run: python build_site.py
    - name: Upload snapshot
      id: upload
      if: steps.pace.outputs.needed == 'true'
      uses: actions/upload-pages-artifact@v4
      with:
        name: test-pages-${{ inputs.cycle }}
        path: dist
        retention-days: 1
    - name: Publish snapshot
      if: steps.pace.outputs.needed == 'true'
      uses: actions/deploy-pages@v4
      with:
        artifact_name: test-pages-${{ inputs.cycle }}
    - name: Remove temporary test artifact after deployment
      if: always() && steps.upload.outputs.artifact_id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
      run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
