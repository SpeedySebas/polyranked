name: Update and publish rankings

on:
  schedule:
    # Fetch every five minutes, three minutes before each display boundary.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'history/**'
      - 'README.md'

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check whether this release still needs data
        id: freshness
        run: python publication_schedule.py

      - name: Set up Python
        if: steps.freshness.outputs.needed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.freshness.outputs.needed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Check ranking calculations and publication safeguards
        if: steps.freshness.outputs.needed == 'true'
        run: |
          python -m unittest discover -s power_rankings -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/live_updates.test.cjs

      - name: Fetch complete live rankings and build website
        if: steps.freshness.outputs.needed == 'true'
        run: python build_site.py

      - name: Configure Pages
        if: steps.freshness.outputs.needed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: steps.freshness.outputs.needed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

      - name: Publish website
        if: steps.freshness.outputs.needed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record one ranking summary per day
        if: steps.freshness.outputs.needed == 'true'
        run: |
          python -c "from build_site import save_daily_summary; save_daily_summary('dist/status.json', 'history')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/
          if ! git diff --cached --quiet; then
            git commit -m 'Record daily ranking summary'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
