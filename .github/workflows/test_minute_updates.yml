name: Test real updates every minute
on:
  workflow_dispatch:
concurrency:
  group: github-pages
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: https://speedysebas.github.io/polyranked/
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify the publisher and countdown
        run: |
          python -m unittest discover -s power_rankings -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/live_updates.test.cjs
      - uses: actions/configure-pages@v5
      - name: Begin a 30 minute cloud test
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          until = (datetime.now(timezone.utc) + timedelta(minutes=30)).isoformat(timespec='seconds').replace('+00:00', 'Z')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RANKING_TEST_UNTIL=' + until + '\n')
          print('One-minute test ends at ' + until)
          PY
      - name: Real update 1 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '1'
      - name: Real update 2 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '2'
      - name: Real update 3 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '3'
      - name: Real update 4 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '4'
      - name: Real update 5 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '5'
      - name: Real update 6 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
          cycle: '6'
      - name: Real update 7 of 30
        continue-on-error: true
        uses: ./.github/actions/test-publication
        with:
