        if: always()
        env:
          RANKING_TEST_UNTIL: ''
        run: python build_site.py
      - name: Upload normal site
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          name: normal-pages
          path: dist
          retention-days: 1
      - name: Restore normal site
        if: success()
        uses: actions/deploy-pages@v4
        with:
          artifact_name: normal-pages

